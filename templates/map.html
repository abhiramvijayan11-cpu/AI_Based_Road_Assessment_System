<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
AI Road Health Map
</title>


<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"/>


<style>

html,body{

margin:0;
padding:0;
height:100%;

}


#map{

height:100vh;
width:100%;

}



.info-box{

background:white;
padding:10px;
border-radius:8px;
box-shadow:0 0 10px gray;

}



</style>


</head>


<body>


<div id="map"></div>



<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>



<script>


// =====================================
// CREATE MAP
// =====================================


const map = L.map("map")
.setView(
[9.96768,76.32989],
15
);



L.tileLayer(

'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',

{

maxZoom:19

}

).addTo(map);





// =====================================
// VARIABLES
// =====================================


let roadLayers=[];

let vehicleMarker=null;





// =====================================
// HEALTH COLOR
// =====================================


function getRoadColor(score){


if(score >= 90){

return "#00C853";

}


else if(score >= 70){

return "#FFD600";

}


else if(score >=40){

return "#FF9100";

}


else{

return "#D50000";

}


}







// =====================================
// LOAD ROAD HEALTH DATA
// =====================================


function loadRoadHealth(){


fetch("/road_health_map")


.then(response=>response.json())


.then(data=>{


console.log(
"Road Health Data:",
data
);



// remove old roads


roadLayers.forEach(layer=>{

map.removeLayer(layer);

});


roadLayers=[];




data.forEach(road=>{



if(
!road.geometry ||
road.geometry.length < 2
){

return;

}




let line=L.polyline(

road.geometry,

{

color:getRoadColor(
road.average_health
),

weight:10,

opacity:0.9

}

).addTo(map);





line.bindPopup(

`

<div class="info-box">


<h3>
🚧 ${road.road_name}
</h3>


<b>Road ID:</b>
${road.road_id}

<br><br>


<b>Health Score:</b>
${road.average_health}%

<br>


<b>Status:</b>
${road.status}


<br><br>


<b>Total Scans:</b>
${road.total_scans}


<br>


<b>Last Updated:</b>
${road.last_update}


</div>

`

);





roadLayers.push(line);



});




});


}









// =====================================
// LIVE VEHICLE LOCATION
// =====================================



function updateVehicle(){



fetch("/latest_location")


.then(response=>response.json())


.then(point=>{



if(
!point.latitude ||
!point.longitude
){

return;

}



let position=[

point.latitude,

point.longitude

];




// create marker first time


if(vehicleMarker==null){


vehicleMarker=L.marker(

position,

{

title:"Current Vehicle"

}

).addTo(map);



}



// move marker


vehicleMarker.setLatLng(position);





vehicleMarker.bindPopup(

`

<b>
🚗 Current Vehicle
</b>

<br><br>


<b>Road:</b>
${point.road_name || "Unknown"}

<br>


<b>Status:</b>
${point.road_health}


<br>


<b>Health:</b>
${point.health_score}%


<br>


<b>Speed:</b>
${Number(point.speed).toFixed(2)}
km/h


<br>


<b>Vibration:</b>
${Number(point.vibration).toFixed(3)}


`

);



});


}







// =====================================
// INITIAL LOAD
// =====================================



loadRoadHealth();

updateVehicle();





// =====================================
// AUTO REFRESH
// =====================================


setInterval(()=>{


loadRoadHealth();


updateVehicle();



},5000);



</script>


</body>

</html>
