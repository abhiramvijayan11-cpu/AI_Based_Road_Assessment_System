<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>Road Health Map</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
        }

        #map {
            height: 100vh;
            width: 100%;
            z-index: 1;
        }

        /* ==========================================
           LEGEND
        ========================================== */

        .legend-card {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;

            background: rgba(20, 24, 33, 0.88);

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            border: 1px solid rgba(255, 255, 255, 0.1);

            padding: 16px;

            border-radius: 12px;

            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.37);

            color: #ffffff;

            min-width: 240px;
        }

        .legend-card h4 {
            margin: 0 0 10px 0;

            font-size: 14px;

            font-weight: 600;

            letter-spacing: 0.5px;

            text-transform: uppercase;

            color: #94a3b8;
        }

        .legend-item {
            display: flex;

            align-items: center;

            margin-bottom: 7px;

            font-size: 13px;
        }

        .legend-item:last-child {
            margin-bottom: 0;
        }

        .color-badge {
            width: 22px;

            height: 7px;

            border-radius: 4px;

            margin-right: 10px;

            display: inline-block;
        }

        /* ==========================================
           POPUP
        ========================================== */

        .leaflet-popup-content-wrapper {
            background: #1e293b;

            color: #f8fafc;

            border-radius: 10px;

            box-shadow:
                0 10px 25px rgba(0, 0, 0, 0.5);

            border:
                1px solid rgba(255, 255, 255, 0.1);

            padding: 4px;
        }

        .leaflet-popup-tip {
            background: #1e293b;
        }

        .info-box {
            padding: 8px 12px;

            font-size: 13px;

            line-height: 1.5;
        }

        .info-box h3 {
            margin: 0 0 8px 0;

            font-size: 15px;

            color: #38bdf8;

            border-bottom:
                1px solid rgba(255, 255, 255, 0.1);

            padding-bottom: 6px;
        }

        .info-row {
            display: flex;

            justify-content: space-between;

            gap: 20px;

            margin-bottom: 4px;
        }

        .info-label {
            color: #94a3b8;

            font-weight: 500;
        }

        .info-val {
            font-weight: 600;

            color: #f1f5f9;
        }
    </style>
</head>


<body>

    <div id="map"></div>


    <!-- ==========================================
         ROAD HEALTH LEGEND
    =========================================== -->

    <div class="legend-card">

        <h4>Road Health Index</h4>

        <div class="legend-item">
            <span class="color-badge" style="background:#22C55E;"></span>
            Excellent (90–100%)
        </div>

        <div class="legend-item">
            <span class="color-badge" style="background:#84CC16;"></span>
            Good (75–89%)
        </div>

        <div class="legend-item">
            <span class="color-badge" style="background:#FACC15;"></span>
            Slight Damage (60–74%)
        </div>

        <div class="legend-item">
            <span class="color-badge" style="background:#F97316;"></span>
            Moderate Damage (40–59%)
        </div>

        <div class="legend-item">
            <span class="color-badge" style="background:#EF4444;"></span>
            Severe Damage (0–39%)
        </div>

    </div>


    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>


    <script>

        // =====================================
        // CREATE MAP
        // =====================================

        const map = L.map("map").setView(
            [9.96768, 76.32989],
            16
        );


        L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                maxZoom: 19,

                attribution:
                    "© OpenStreetMap contributors"
            }
        ).addTo(map);


        // =====================================
        // VARIABLES
        // =====================================

        let roadLayers = [];

        let vehicleMarker = null;

        let hasCenteredMap = false;


        // =====================================
        // HEALTH COLOR
        // =====================================

        function getRoadColor(score) {

            score = Number(score);

            if (score >= 90)
                return "#22C55E";

            if (score >= 75)
                return "#84CC16";

            if (score >= 60)
                return "#FACC15";

            if (score >= 40)
                return "#F97316";

            return "#EF4444";
        }


        // =====================================
        // LOAD ONLY SCANNED ROAD SEGMENTS
        // =====================================

        function loadRoadHealth() {

            /*
             * IMPORTANT:
             *
             * We use the current map center and
             * only search within 50 metres.
             *
             * This prevents roads far away from
             * appearing on the map.
             */

            let center = map.getCenter();


            let url =
                `/api/road-segments` +
                `?latitude=${center.lat}` +
                `&longitude=${center.lng}` +
                `&radius=0.05`;


            fetch(url)

                .then(response => response.json())

                .then(segments => {

                    console.log(
                        "Loaded Road Segments:",
                        segments
                    );


                    // ---------------------------------
                    // REMOVE PREVIOUS ROAD MARKINGS
                    // ---------------------------------

                    roadLayers.forEach(layer => {

                        map.removeLayer(layer);

                    });


                    roadLayers = [];


                    // ---------------------------------
                    // NOTHING TO DISPLAY
                    // ---------------------------------

                    if (
                        !segments ||
                        segments.length === 0
                    ) {

                        return;

                    }


                    // ---------------------------------
                    // DISPLAY SCANNED SEGMENTS
                    // ---------------------------------

                    segments.forEach(segment => {


                        if (
                            !segment.geometry ||
                            segment.geometry.length < 2
                        ) {

                            return;

                        }


                        // ---------------------------------
                        // GET HEALTH COLOR
                        // ---------------------------------

                        let healthColor =
                            getRoadColor(
                                segment.average_health
                            );


                        // ---------------------------------
                        // DRAW ONLY SCANNED ROAD
                        // ---------------------------------

                        let colorLine =
                            L.polyline(
                                segment.geometry,
                                {
                                    color: healthColor,

                                    weight: 7,

                                    opacity: 0.95,

                                    lineCap: "round",

                                    lineJoin: "round"
                                }
                            ).addTo(map);


                        // ---------------------------------
                        // POPUP
                        // ---------------------------------

                        colorLine.bindPopup(`

                            <div class="info-box">

                                <h3>
                                    🚧
                                    ${segment.road_name || "Unknown Road"}
                                </h3>


                                <div class="info-row">

                                    <span class="info-label">
                                        Segment:
                                    </span>

                                    <span class="info-val">
                                        #${segment.segment_number}
                                    </span>

                                </div>


                                <div class="info-row">

                                    <span class="info-label">
                                        Road ID:
                                    </span>

                                    <span class="info-val">
                                        ${segment.road_id}
                                    </span>

                                </div>


                                <div class="info-row">

                                    <span class="info-label">
                                        Health:
                                    </span>

                                    <span
                                        class="info-val"
                                        style="color:${healthColor}"
                                    >
                                        ${Number(
                            segment.average_health
                        ).toFixed(2)}%
                                    </span>

                                </div>


                                <div class="info-row">

                                    <span class="info-label">
                                        Status:
                                    </span>

                                    <span class="info-val">
                                        ${segment.status || "Unknown"}
                                    </span>

                                </div>


                                <div class="info-row">

                                    <span class="info-label">
                                        Total Scans:
                                    </span>

                                    <span class="info-val">
                                        ${segment.total_scans || 0}
                                    </span>

                                </div>


                                <div class="info-row">

                                    <span class="info-label">
                                        Last Updated:
                                    </span>

                                    <span class="info-val">
                                        ${segment.last_update || "Unknown"}
                                    </span>

                                </div>

                            </div>

                        `);


                        // ---------------------------------
                        // SAVE LAYER
                        // ---------------------------------

                        roadLayers.push(colorLine);

                    });

                })

                .catch(err => {

                    console.error(
                        "Error loading road segments:",
                        err
                    );

                });

        }


        // =====================================
        // LIVE VEHICLE LOCATION
        // =====================================

        function updateVehicle() {

            fetch("/latest_location")

                .then(response => response.json())

                .then(point => {


                    if (
                        point.latitude === null ||
                        point.latitude === undefined ||
                        point.longitude === null ||
                        point.longitude === undefined
                    ) {

                        return;

                    }


                    let position = [
                        Number(point.latitude),
                        Number(point.longitude)
                    ];


                    // ---------------------------------
                    // CHECK WHETHER VEHICLE MOVED
                    // ---------------------------------

                    let moved = true;


                    if (vehicleMarker !== null) {

                        const oldPosition =
                            vehicleMarker.getLatLng();


                        const distance =
                            map.distance(
                                oldPosition,
                                position
                            );


                        /*
                         * Road map is updated only
                         * after 5 metres of movement.
                         */

                        moved =
                            distance >= 5;

                    }


                    // ---------------------------------
                    // CENTER MAP ON FIRST LOCATION
                    // ---------------------------------

                    if (!hasCenteredMap) {

                        map.setView(
                            position,
                            16
                        );

                        hasCenteredMap = true;

                    }


                    // ---------------------------------
                    // CREATE / MOVE VEHICLE MARKER
                    // ---------------------------------

                    if (vehicleMarker === null) {

                        vehicleMarker =
                            L.marker(
                                position,
                                {
                                    title:
                                        "Current Vehicle"
                                }
                            ).addTo(map);

                    }
                    else {

                        vehicleMarker.setLatLng(
                            position
                        );

                    }


                    // ---------------------------------
                    // UPDATE ROAD MARKING
                    // ONLY AFTER MOVEMENT
                    // ---------------------------------

                    if (moved) {

                        loadRoadHealth();

                    }


                    // ---------------------------------
                    // VEHICLE POPUP
                    // ---------------------------------

                    vehicleMarker.bindPopup(`

                        <div class="info-box">

                            <h3>
                                🚗 Live Scan Location
                            </h3>


                            <div class="info-row">

                                <span class="info-label">
                                    Road:
                                </span>

                                <span class="info-val">
                                    ${point.road_name || "Unknown"}
                                </span>

                            </div>


                            <div class="info-row">

                                <span class="info-label">
                                    Status:
                                </span>

                                <span class="info-val">
                                    ${point.road_health || "Unknown"}
                                </span>

                            </div>


                            <div class="info-row">

                                <span class="info-label">
                                    Health:
                                </span>

                                <span class="info-val">
                                    ${Number(
                        point.health_score || 0
                    ).toFixed(0)}%
                                </span>

                            </div>


                            <div class="info-row">

                                <span class="info-label">
                                    Speed:
                                </span>

                                <span class="info-val">
                                    ${Number(
                        point.speed || 0
                    ).toFixed(2)}
                                    km/h
                                </span>

                            </div>


                            <div class="info-row">

                                <span class="info-label">
                                    Vibration:
                                </span>

                                <span class="info-val">
                                    ${Number(
                        point.vibration || 0
                    ).toFixed(3)}
                                </span>

                            </div>

                        </div>

                    `);

                })

                .catch(err => {

                    console.error(
                        "Error fetching vehicle position:",
                        err
                    );

                });

        }


        // =====================================
        // INITIAL LOAD
        // =====================================

        updateVehicle();


        // =====================================
        // AUTO UPDATE VEHICLE LOCATION
        //
        // IMPORTANT:
        // Do NOT call loadRoadHealth() here.
        //
        // updateVehicle() decides whether the
        // vehicle actually moved.
        // =====================================

        setInterval(() => {

            updateVehicle();

        }, 5000);

    </script>

</body>

</html>
